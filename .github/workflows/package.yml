name: Package
on:
  workflow_call:
    inputs:
      version:
        description: SourceGitPlus package version
        required: true
        type: string
jobs:
  windows:
    name: Package Windows
    runs-on: windows-2022
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegitplus.${{ matrix.runtime }}
          path: build/SourceGitPlus
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: ./build/scripts/package.win.ps1
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DRuntime=$env:RUNTIME" "/DSourceDir=$PWD\build\SourceGitPlus" "/DOutDir=$PWD\build" build\windows\SourceGitPlus.iss
          if ($LASTEXITCODE) { throw 'ISCC failed' }
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: |
            build/sourcegitplus_*.zip
            build/SourceGitPlus-*-setup.exe
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegitplus.${{ matrix.runtime }}
  osx-app:
    name: Package macOS
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-x64, osx-arm64]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegitplus.${{ matrix.runtime }}
          path: build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir build/SourceGitPlus
          tar -xf "build/sourcegitplus.${{ matrix.runtime }}.tar" -C build/SourceGitPlus
          ./build/scripts/package.osx-app.sh
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: build/sourcegitplus_*.zip
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegitplus.${{ matrix.runtime }}
  linux:
    name: Package Linux
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      matrix:
        runtime: [linux-x64, linux-arm64]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download package dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
          apt-get update
          apt-get install -y curl wget git dpkg-dev fakeroot tzdata zip unzip desktop-file-utils rpm libfuse2 file build-essential binutils
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: sourcegitplus.${{ matrix.runtime }}
          path: build
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          RUNTIME: ${{ matrix.runtime }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir build/SourceGitPlus
          tar -xf "build/sourcegitplus.${{ matrix.runtime }}.tar" -C build/SourceGitPlus
          ./build/scripts/package.linux.sh
      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.runtime }}
          path: |
            build/sourcegitplus-*.AppImage
            build/sourcegitplus-*.AppImage.zsync
            build/sourcegitplus_*.deb
            build/sourcegitplus-*.rpm
      - name: Delete temp artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: sourcegitplus.${{ matrix.runtime }}
